name: Rust Windows

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-windows.yml'
      - 'specs/001-rust-wallpaper-app/contracts/**'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-windows.yml'
      - 'specs/001-rust-wallpaper-app/contracts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-windows:
    name: Format, lint, build and deterministic tests (MSVC x64)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned Rust toolchain
        # rustup reads rust/rust-toolchain.toml, including fmt, clippy and target.
        run: rustup show active-toolchain
      - name: Require reviewed dependency lockfile
        run: |
          if (!(Test-Path Cargo.lock)) {
            throw 'T002 blocked: generate and review rust/Cargo.lock before CI can pass.'
          }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: WARP clear/present smoke (GitHub runner only; separate from WindowsEnv)
        continue-on-error: true
        run: |
          & .\target\x86_64-pc-windows-msvc\release\probe_d3d11.exe --warp
          if ($LASTEXITCODE -ne 0) {
            throw 'WARP smoke failed on this GitHub Actions runner (not WindowsEnv).'
          }
      - name: DXGI Present(1) pacing diagnostic (hosted runner only)
        continue-on-error: true
        run: |
          & .\target\x86_64-pc-windows-msvc\release\probe_pacing.exe --driver warp --max-fps 120 --frames 12
          if ($LASTEXITCODE -ne 0) {
            "Pacing runtime SKIPPED/FAIL: hosted runner lacks a verified display; see logs. WindowsEnv and real display validation pending." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Pacing Present(1) diagnostic ran on a hidden window. Real VSync and output rate still NOT verified." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: One-shot total CPU and GPU PDH diagnostics (hosted runner only)
        continue-on-error: true
        run: |
          & .\target\x86_64-pc-windows-msvc\release\probe_usage.exe --metric cpu_total --budget-ms 400
          if ($LASTEXITCODE -ne 0) {
            "CPU total read: SKIPPED/FAIL; see logs. Never assume idle CPU." >> $env:GITHUB_STEP_SUMMARY
          }
          & .\target\x86_64-pc-windows-msvc\release\probe_usage.exe --metric gpu_total --budget-ms 400
          if ($LASTEXITCODE -ne 0) {
            "GPU Engine PDH read: SKIPPED/FAIL; no substitution of zero usage." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "GPU Engine PDH short-sample result is provisional, NOT production-approved." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: WorkerW topology read-only smoke (GitHub runner only)
        run: |
          & .\target\x86_64-pc-windows-msvc\release\probe_workerw.exe --inspect
          if ($LASTEXITCODE -eq 2) {
            "WorkerW topology SKIPPED: no supported interactive Explorer desktop on this CI runner." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'WorkerW read-only probe had an unexpected failure.'
          }
          "WorkerW discovery completed; behind-icon visibility remains unverified." >> $env:GITHUB_STEP_SUMMARY
      - name: Bounded hidden Win32 message loop smoke (hosted runner only)
        timeout-minutes: 1
        run: |
          & .\target\x86_64-pc-windows-msvc\release\yuauy-wallpaper.exe --shell-smoke
          if ($LASTEXITCODE -ne 0) {
            throw 'Hidden Win32 smoke failed to create, tick, or destroy its own HWND.'
          }
      - name: Read-only Windows foundation inventory and API probes (hosted runner only)
        run: |
          & .\scripts\foundation-inventory.ps1 -ProbeDirectory .\target\x86_64-pc-windows-msvc\release -RunReadOnlyProbes
          if ($LASTEXITCODE -ne 0) {
            throw 'Foundation inventory or a safe API probe reported an unexpected failure.'
          }
      - name: Raised-desktop D3D11 read-only inspection (hosted runner only)
        run: |
          & .\target\x86_64-pc-windows-msvc\release\probe_desktop_d3d11.exe --inspect
          if ($LASTEXITCODE -eq 2) {
            "D3D11 desktop composition SKIPPED: no eligible raised desktop on hosted CI." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { throw 'Read-only D3D11 desktop probe failed' }
          "D3D11 read-only topology valid; visual attachment NOT executed in hosted CI." >> $env:GITHUB_STEP_SUMMARY
      - name: DirectComposition desktop read-only inspection (hosted runner only)
        run: |
          & .\target\x86_64-pc-windows-msvc\release\probe_desktop_dcomp.exe --inspect
          if ($LASTEXITCODE -eq 2) {
            "DirectComposition inspection SKIPPED: no supported Explorer topology." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { throw 'Read-only DirectComposition probe failed' }
          "DirectComposition inspected only; composition APIs and visible wallpaper remain unverified." >> $env:GITHUB_STEP_SUMMARY
      - name: Windows compatibility manifest and layered-child creation smoke
        continue-on-error: true
        run: |
          $lines = @(& .\target\x86_64-pc-windows-msvc\release\probe_win32_window.exe)
          $lines | Write-Output
          if ($LASTEXITCODE -ne 0) { throw 'Win32 child-window diagnostic crashed' }
          if ($lines -match 'PROGMAN_EXISTS=true' -and
              $lines -notmatch 'CASE=layered_child PASS') {
            throw 'Layered child creation failed: check embedded Win8+/Windows11 manifest.'
          }
      - name: Upload foundation probes for explicit WindowsEnv acceptance (NOT a production release)
        uses: actions/upload-artifact@v4
        with:
          name: yuauy-foundation-probes-windows-x64
          retention-days: 3
          if-no-files-found: error
          path: |
            rust/target/x86_64-pc-windows-msvc/release/probe_d3d11.exe
            rust/target/x86_64-pc-windows-msvc/release/probe_workerw.exe
            rust/target/x86_64-pc-windows-msvc/release/probe_desktop_d3d11.exe
            rust/target/x86_64-pc-windows-msvc/release/probe_desktop_dcomp.exe
            rust/target/x86_64-pc-windows-msvc/release/probe_win32_window.exe
            rust/target/x86_64-pc-windows-msvc/release/probe_pacing.exe
            rust/target/x86_64-pc-windows-msvc/release/probe_usage.exe
            rust/scripts/foundation-inventory.ps1
      - name: Deterministic tests (no desktop or hardware side effects)
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Record separate Windows acceptance gates
        run: |
          @'
          CI checks compilation and non-interactive tests only.
          Future desktop, registry, WARP and physical-GPU tests must be #[ignore]
          with a reason and run explicitly on the appropriate authorized machine.
          WindowsEnv WARP/WorkerW and physical GPU/multi-monitor acceptance remain
          separate manual gates in specs/001-rust-wallpaper-app/quickstart.md.
          '@ >> $env:GITHUB_STEP_SUMMARY
