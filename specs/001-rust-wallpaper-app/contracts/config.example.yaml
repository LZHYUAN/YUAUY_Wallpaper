# YUAUY Wallpaper — user-approved defaults (2026-11-03).
# All values below can be edited and reloaded from the system tray.
# The Windows login autostart checkbox is managed directly by Windows, NOT in YAML.
image_folders:
  - 'C:\Users\Public\Pictures'
slideshow_interval_seconds: 30
load_guard:
  enabled: true
  metric: gpu_total       # WindowsEnv without a GPU: cpu_total
  threshold_percent: 60  # Single threshold: >=60 skip, <60 proceed
# No resume threshold, no polling interval, no long calibration process.
# When no images exist, rescan only on the normal slideshow deadline.
# During animation, frame presentation targets display refresh via VSync.
